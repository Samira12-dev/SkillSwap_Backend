services:
  mysql:
    image: mysql:8.0
    container_name: skillswap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: skillswap_db
    ports:
      - "3310:3306"
    volumes:
      - skillswap-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skillswap-network

  app:
    build: .
    container_name: skillswap-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8080:8080"
    networks:
      - skillswap-network

  frontend:
    build: ../skillswap_frontend
    container_name: skillswap-frontend
    depends_on:
      - app
    ports:
      - "5173:5173"
    networks:
      - skillswap-network

volumes:
  skillswap-db-data:

networks:
  skillswap-network: